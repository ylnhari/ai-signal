      <ellipse cx="0" cy="-35" rx="18" ry="6" fill="#111827" />
      <path d="M 0,-35 L 0,5" stroke="#111827" stroke-width="5" />
      <path d="M -12,-15 L 12,-15" stroke="#111827" stroke-width="5" />
      <path d="M 0,5 L -12,20 M 0,5 L 12,20" stroke="#111827" stroke-width="4" />
      <path d="M -28,-35 Q 0,-65 28,-35 Z" fill="#10b981" />
      <line x1="0" y1="-35" x2="0" y2="-10" stroke="#111827" stroke-width="2" />
    </g>
    <!-- Person 4 -->
    <g transform="translate(420, 710)">
      <ellipse cx="0" cy="-35" rx="18" ry="6" fill="#111827" />
      <path d="M 0,-35 L 0,5" stroke="#111827" stroke-width="5" />
      <path d="M -12,-15 L 12,-15" stroke="#111827" stroke-width="5" />
      <path d="M 0,5 L -12,20 M 0,5 L 12,20" stroke="#111827" stroke-width="4" />
      <path d="M -28,-35 Q 0,-65 28,-35 Z" fill="#facc15" />
      <line x1="0" y1="-35" x2="0" y2="-10" stroke="#111827" stroke-width="2" />
    </g>
  </g>

  <!-- Bicycle -->
  <g id="bicycle" transform="translate(120, 740)">
    <circle cx="30" cy="40" r="22" fill="none" stroke="#111827" stroke-width="4" />
    <circle cx="100" cy="40" r="22" fill="none" stroke="#111827" stroke-width="4" />
    <line x1="30" y1="40" x2="65" y2="10" stroke="#111827" stroke-width="5" />
    <line x1="100" y1="40" x2="65" y2="10" stroke="#111827" stroke-width="5" />
    <line x1="65" y1="10" x2="65" y2="-25" stroke="#111827" stroke-width="5" />
    <line x1="65" y1="-25" x2="90" y2="-35" stroke="#111827" stroke-width="5" />
  </g>

  <!-- Puddle -->
  <g id="puddle-group">
    <path id="puddle" d="M -50,800 Q 150,700 300,750 T 600,730 T 900,760 T 1250,780 L 1250,850 L -50,850 Z" fill="#1e293b" opacity="0.85" />
    <!-- Puddle Reflections -->
    <rect x="100" y="730" width="200" height="30" fill="#f97316" opacity="0.25" transform="skewX(-30)" />
    <rect x="450" y="710" width="300" height="40" fill="#3b82f6" opacity="0.25" transform="skewX(-30)" />
    <rect x="850" y="740" width="200" height="30" fill="#10b981" opacity="0.25" transform="skewX(-30)" />
    <!-- Light reflections on puddle -->
    <path d="M 150,760 Q 200,750 250,760" fill="none" stroke="#fef3c7" stroke-width="2" opacity="0.4" />
    <path d="M 500,740 Q 600,720 700,740" fill="none" stroke="#fef3c7" stroke-width="2" opacity="0.4" />
    <path d="M 880,760 Q 950,750 1020,760" fill="none" stroke="#fef3c7" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Monsoon Rain (Foreground) -->
