<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0f1c" />
      <stop offset="40%" stop-color="#2a1f3d" />
      <stop offset="80%" stop-color="#8a4f5e" />
      <stop offset="100%" stop-color="#d98c4a" />
    </linearGradient>
    
    <!-- Moon Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fef3c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="1200" height="800" fill="url(#sky)" />

  <!-- Moon and Glow -->
  <circle cx="180" cy="160" r="100" fill="url(#moonGlow)" />
  <circle id="moon" cx="180" cy="160" r="45" fill="#fef3c7" opacity="0.95" />

  <!-- Monsoon Clouds -->
  <path d="M 0,200 Q 100,80 200,150 T 400,120 T 600,180 T 800,110 T 1000,160 L 1200,120 L 1200,0 L 0,0 Z" fill="#1c1a2e" opacity="0.6" />
  <path d="M 0,250 Q 150,150 300,220 T 550,180 T 800,240 T 1050,170 L 1200,200 L 1200,0 L 0,0 Z" fill="#19172a" opacity="0.5" />
  <path d="M 0,300 Q 200,200 350,280 T 700,220 T 1000,290 L 1200,240 L 1200,0 L 0,0 Z" fill="#141129" opacity="0.4" />

  <!-- Background City Buildings -->
  <g id="buildings">
    <rect x="30" y="350" width="90" height="450" fill="#15122a" />
    <rect x="120" y="280" width="110" height="520" fill="#0f0d1f" />
    <rect x="230" y="380" width="70" height="420" fill="#15122a" />
    <!-- Temple Gopuram -->
    <polygon points="320,400 380,200 440,400" fill="#1b1730" />
    <polygon points="335,400 380,240 425,400" fill="#141129" />
    <polygon points="345,400 380,260 415,400" fill="#1b1730" />
    <rect x="320" y="400" width="120" height="400" fill="#1b1730" />
    <rect x="340" y="400" width="80" height="400" fill="#141129" />
    <rect x="450" y="320" width="100" height="480" fill="#0f0d1f" />
    <rect x="550" y="400" width="80" height="400" fill="#15122a" />
    <rect x="780" y="350" width="120" height="450" fill="#121022" />
    <rect x="900" y="420" width="90" height="380" fill="#0f0d1f" />
    <rect x="990" y="280" width="100" height="520" fill="#15122a" />
    <rect x="1090" y="380" width="110" height="420" fill="#0f0d1f" />
  </g>

  <!-- Trees -->
  <g id="trees">
    <path d="M 60,800 L 70,550 L 80,800 Z" fill="#0f0d1f" />
    <path d="M 70,550 Q 30,530 10,540" fill="none" stroke="#0f0d1f" stroke-width="8" />
    <path d="M 70,570 Q 100,550 120,560" fill="none" stroke="#0f0d1f" stroke-width="8" />
    <path d="M 70,560 Q 40,510 20,490" fill="none" stroke="#0f0d1f" stroke-width="6" />
    <path d="M 70,580 Q 90,520 110,500" fill="none" stroke="#0f0d1f" stroke-width="6" />
    <path d="M 70,590 Q 70,530 65,490" fill="none" stroke="#0f0d1f" stroke-width="6" />
  </g>

  <!-- Ground / Street -->
  <rect x="0" y="650" width="1200" height="150" fill="#111827" />

  <!-- Street Market Stalls -->
  <g id="stalls">
    <!-- Stall 1 - Fruit/Flower Shop -->
    <rect x="100" y="480" width="200" height="320" fill="#2d223a" />
    <rect x="80" y="450" width="240" height="30" fill="#4a2e4b" />
    <polygon points="80,450 320,450 300,410 100,410" fill="#f97316" />
    <rect x="110" y="580" width="180" height="220" fill="#1e1a2e" />
    <!-- Items on counter -->
    <circle cx="150" cy="580" r="15" fill="#f87171" />
    <circle cx="190" cy="580" r="15" fill="#facc15" />
    <circle cx="230" cy="580" r="15" fill="#4ade80" />
    <circle cx="270" cy="580" r="15" fill="#f87171" />
    <rect x="280" y="560" width="20" height="30" fill="#374151" />
    <circle cx="290" cy="560" r="15" fill="#374151" />

    <!-- Stall 2 - KAAPI Stall (Center) -->
    <rect x="450" y="430" width="300" height="370" fill="#2d223a" />
    <rect x="430" y="400" width="340" height="30" fill="#4a2e4b" />
    <polygon points="430,400 770,400 740,360 460,360" fill="#3b82f6" />
    <rect x="460" y="560" width="280" height="240" fill="#1e1a2e" />
    
    <!-- KAAPI Sign -->
    <rect x="480" y="460" width="240" height="50" rx="5" fill="#1f2937" stroke="#fbbf24" stroke-width="3" />
    <text x="600" y="494" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="#fbbf24" text-anchor="middle">KAAPI</text>
    
    <!-- Coffee Glasses on Counter -->
    <rect x="520" y="570" width="24" height="35" fill="#78350f" />
    <rect x="560" y="570" width="24" height="35" fill="#78350f" />
    <rect x="600" y="570" width="24" height="35" fill="#78350f" />
    <rect x="640" y="570" width="24" height="35" fill="#78350f" />
    <rect x="680" y="570" width="24" height="35" fill="#78350f" />

    <!-- Steam from Coffee -->
    <path d="M 532,460 Q 537,440 532,430" fill="none" stroke="#9ca3af" stroke-width="3" opacity="0.6" />
    <path d="M 572,460 Q 577,435 572,420" fill="none" stroke="#9ca3af" stroke-width="3" opacity="0.6" />
    <path d="M 612,460 Q 617,440 612,425" fill="none" stroke="#9ca3af" stroke-width="3" opacity="0.6" />
    <path d="M 652,460 Q 657,435 652,415" fill="none" stroke="#9ca3af" stroke-width="3" opacity="0.6" />

    <!-- Stall 3 - Textile/General Store -->
    <rect x="850" y="500" width="200" height="300" fill="#2d223a" />
    <rect x="830" y="470" width="240" height="30" fill="#4a2e4b" />
    <polygon points="830,470 1070,470 1050,430 850,430" fill="#10b981" />
    <rect x="860" y="600" width="180" height="200" fill="#1e1a2e" />
    <!-- Textiles Hanging -->
    <rect x="870" y="500" width="40" height="100" fill="#ec4899" />
    <rect x="920" y="500" width="40" height="100" fill="#8b5cf6" />
    <rect x="970" y="500" width="40" height="100" fill="#06b6d4" />
    <rect x="1020" y="500" width="40" height="100" fill="#f43f5e" />

    <!-- Hanging String Lights -->
    <path d="M 120,410 Q 210,400 320,410" fill="none" stroke="#4b5563" stroke-width="2" />
    <circle cx="150" cy="410" r="5" fill="#fef3c7" opacity="0.9" />
    <circle cx="200" cy="405" r="5" fill="#fef3c7" opacity="0.9" />
    <circle cx="250" cy="405" r="5" fill="#fef3c7" opacity="0.9" />
    <circle cx="300" cy="410" r="5" fill="#fef3c7" opacity="0.9" />

    <path d="M 460,360 Q 580,350 730,360" fill="none" stroke="#4b5563" stroke-width="2" />
    <circle cx="500" cy="355" r="5" fill="#fef3c7" opacity="0.9" />
    <circle cx="550" cy="352" r="5" fill="#fef3c7" opacity="0.9" />
    <circle cx="600" cy="352" r="5" fill="#fef3c7" opacity="0.9" />
    <circle cx="650" cy="354" r="5" fill="#fef3c7" opacity="0.9" />
    <circle cx="700" cy="358" r="5" fill="#fef3c7" opacity="0.9" />

    <path d="M 850,430 Q 940,420 1060,430" fill="none" stroke="#4b5563" stroke-width="2" />
    <circle cx="880" cy="425" r="5" fill="#fef3c7" opacity="0.9" />
    <circle cx="930" cy="422" r="5" fill="#fef3c7" opacity="0.9" />
    <circle cx="980" cy="423" r="5" fill="#fef3c7" opacity="0.9" />
    <circle cx="1030" cy="426" r="5" fill="#fef3c7" opacity="0.9" />

    <!-- Ground Lighting Effects -->
    <ellipse cx="200" cy="800" rx="180" ry="40" fill="#fef3c7" opacity="0.08" />
    <ellipse cx="600" cy="800" rx="220" ry="50" fill="#fef3c7" opacity="0.08" />
    <ellipse cx="950" cy="800" rx="180" ry="40" fill="#fef3c7" opacity="0.08" />
  </g>

  <!-- People with Umbrellas -->
  <g id="people">
    <!-- Person 1 -->
    <g transform="translate(250, 680)">
      <ellipse cx="0" cy="-35" rx="18" ry="6" fill="#111827" />
      <path d="M 0,-35 L 0,5" stroke="#111827" stroke-width="5" />
      <path d="M -12,-15 L 12,-15" stroke="#111827" stroke-width="5" />
      <path d="M 0,5 L -12,20 M 0,5 L 12,20" stroke="#111827" stroke-width="4" />
      <path d="M -28,-35 Q 0,-65 28,-35 Z" fill="#f97316" />
      <line x1="0" y1="-35" x2="0" y2="-10" stroke="#111827" stroke-width="2" />
    </g>
    <!-- Person 2 -->
    <g transform="translate(780, 660)">
      <ellipse cx="0" cy="-35" rx="18" ry="6" fill="#111827" />
      <path d="M 0,-35 L 0,5" stroke="#111827" stroke-width="5" />
      <path d="M -12,-15 L 12,-15" stroke="#111827" stroke-width="5" />
      <path d="M 0,5 L -12,20 M 0,5 L 12,20" stroke="#111827" stroke-width="4" />
      <path d="M -28,-35 Q 0,-65 28,-35 Z" fill="#3b82f6" />
      <line x1="0" y1="-35" x2="0" y2="-10" stroke="#111827" stroke-width="2" />
    </g>
    <!-- Person 3 -->
