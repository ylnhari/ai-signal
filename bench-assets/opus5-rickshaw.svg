<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="An auto-rickshaw towing a server rack up a steep hill in monsoon rain">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#101c2b"/>
      <stop offset="0.45" stop-color="#22384e"/>
      <stop offset="1" stop-color="#4a6478"/>
    </linearGradient>
    <linearGradient id="hillG" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2c4a3a"/>
      <stop offset="1" stop-color="#16261f"/>
    </linearGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33383e"/>
      <stop offset="0.6" stop-color="#434a52"/>
      <stop offset="1" stop-color="#2b3036"/>
    </linearGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbeaff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#dbeaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb8c9" stop-opacity="0"/>
      <stop offset="1" stop-color="#9fb8c9" stop-opacity="0.28"/>
    </linearGradient>

    <pattern id="rainFar" width="24" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <line x1="5" y1="2" x2="5" y2="26" stroke="#cfe6f5" stroke-width="1" opacity="0.22"/>
      <line x1="16" y1="34" x2="16" y2="56" stroke="#cfe6f5" stroke-width="1" opacity="0.16"/>
    </pattern>
    <pattern id="rainNear" width="46" height="110" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <line x1="8" y1="0" x2="8" y2="44" stroke="#e8f5ff" stroke-width="1.8" opacity="0.34"/>
      <line x1="30" y1="58" x2="30" y2="96" stroke="#e8f5ff" stroke-width="1.4" opacity="0.24"/>
      <line x1="40" y1="12" x2="40" y2="38" stroke="#e8f5ff" stroke-width="2.2" opacity="0.18"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fgblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <clipPath id="beamClip">
      <path d="M74,-56 L210,-100 L215,-6 L76,-26 Z" transform="translate(560,338.7) rotate(-25)"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect width="900" height="600" fill="url(#sky)"/>

  <!-- storm clouds -->
  <g fill="#0d1622" opacity="0.75" filter="url(#soft)">
    <ellipse cx="120" cy="70" rx="170" ry="52"/>
    <ellipse cx="320" cy="46" rx="200" ry="44"/>
    <ellipse cx="600" cy="66" rx="180" ry="46"/>
    <ellipse cx="820" cy="38" rx="150" ry="38"/>
    <ellipse cx="230" cy="130" rx="140" ry="34" opacity="0.7"/>
    <ellipse cx="560" cy="140" rx="160" ry="30" opacity="0.55"/>
  </g>

  <!-- lightning -->
  <circle cx="672" cy="110" r="150" fill="url(#flash)"/>
  <path d="M694,18 L656,104 L688,100 L644,196 L674,110 L646,116 Z" fill="#eaf3ff" opacity="0.85" filter="url(#glow)"/>

  <!-- distant rain-hazed ranges -->
  <path d="M-10,486 L100,352 L200,432 L310,356 L400,412 L470,372 L560,300 L640,326 L760,232 L900,168 L900,600 L-10,600 Z"
        fill="#5d7a8e" opacity="0.35"/>
  <path d="M-10,540 L80,430 L180,494 L280,424 L380,470 L500,392 L620,352 L740,282 L900,206 L900,600 L-10,600 Z"
        fill="#3b5364" opacity="0.5"/>
  <rect x="0" y="150" width="900" height="450" fill="url(#mist)"/>

  <!-- the steep hill -->
  <path d="M0,600 L900,180 L900,600 Z" fill="url(#hillG)"/>
  <!-- roadway -->
  <path d="M0,600 L900,180 L900,214 L0,634 Z" fill="url(#roadG)"/>
  <path d="M0,600 L900,180" stroke="#7d8b96" stroke-width="2" opacity="0.35"/>
  <path d="M0,634 L900,214" stroke="#0e1518" stroke-width="3" opacity="0.5"/>
  <!-- wet sheen + water running down the road -->
  <g stroke="#bcd8e8" stroke-linecap="round" opacity="0.22">
    <path d="M120,584 L300,500" stroke-width="2"/>
    <path d="M250,538 L430,454" stroke-width="1.5"/>
    <path d="M470,436 L640,356" stroke-width="2"/>
    <path d="M660,344 L820,270" stroke-width="1.5"/>
    <path d="M60,596 L180,540" stroke-width="1.2"/>
  </g>
  <!-- puddles -->
  <g opacity="0.5">
    <ellipse cx="210" cy="556" rx="46" ry="9" fill="#8fb6cd" opacity="0.35" transform="rotate(-25 210 556)"/>
    <ellipse cx="700" cy="326" rx="30" ry="6" fill="#8fb6cd" opacity="0.3" transform="rotate(-25 700 326)"/>
    <ellipse cx="210" cy="556" rx="18" ry="4" fill="none" stroke="#cfe6f5" stroke-width="1" transform="rotate(-25 210 556)"/>
    <ellipse cx="702" cy="325" rx="12" ry="3" fill="none" stroke="#cfe6f5" stroke-width="0.8" transform="rotate(-25 702 325)"/>
  </g>

  <!-- roadside kilometre stone -->
  <g transform="translate(770,240) rotate(-25)">
    <path d="M-11,0 L-11,-20 Q-11,-28 0,-28 Q11,-28 11,-20 L11,0 Z" fill="#d8d3c6"/>
    <path d="M-11,-20 Q-11,-28 0,-28 Q11,-28 11,-20 Z" fill="#e0a52e"/>
    <rect x="-11" y="-9" width="22" height="1.6" fill="#7c7768" opacity="0.7"/>
  </g>

  <!-- ================= TOWED SERVER RACK ON TRAILER ================= -->
  <g transform="translate(340,441.3) rotate(-25)">
    <ellipse cx="0" cy="2" rx="70" ry="7" fill="#080c0e" opacity="0.45"/>

    <!-- wheels -->
    <g>
      <circle cx="-32" cy="-14" r="14" fill="#15181c"/><circle cx="-32" cy="-14" r="5" fill="#6c757e"/>
      <circle cx="34" cy="-14" r="14" fill="#15181c"/><circle cx="34" cy="-14" r="5" fill="#6c757e"/>
    </g>
    <!-- trailer bed + tow eye -->
    <rect x="-58" y="-42" width="116" height="12" rx="3" fill="#4b525a"/>
    <rect x="-58" y="-32" width="116" height="4" fill="#252a2f"/>
    <path d="M58,-38 L74,-32 L74,-27 L58,-30 Z" fill="#5a626b"/>

    <!-- rack cabinet -->
    <rect x="-46" y="-174" width="92" height="132" rx="4" fill="#20242a" stroke="#0d1013" stroke-width="2"/>
    <rect x="-38" y="-166" width="76" height="116" fill="#2b3037"/>
    <g>
      <rect x="-36" y="-164" width="72" height="16" fill="#171b20" stroke="#3b424c"/>
      <rect x="-36" y="-146" width="72" height="16" fill="#1c2127" stroke="#3b424c"/>
      <rect x="-36" y="-128" width="72" height="16" fill="#171b20" stroke="#3b424c"/>
      <rect x="-36" y="-110" width="72" height="16" fill="#1c2127" stroke="#3b424c"/>
      <rect x="-36" y="-92" width="72" height="16" fill="#171b20" stroke="#3b424c"/>
      <rect x="-36" y="-74" width="72" height="20" fill="#1c2127" stroke="#3b424c"/>
    </g>
    <g filter="url(#glow)">
      <rect x="26" y="-160" width="5" height="5" fill="#57e08a"/>
      <rect x="18" y="-160" width="5" height="5" fill="#57e08a"/>
      <rect x="26" y="-142" width="5" height="5" fill="#f0b429"/>
      <rect x="18" y="-142" width="5" height="5" fill="#57e08a"/>
      <rect x="26" y="-124" width="5" height="5" fill="#57e08a"/>
      <rect x="26" y="-106" width="5" height="5" fill="#57e08a"/>
      <rect x="18" y="-106" width="5" height="5" fill="#f05a5a"/>
      <rect x="26" y="-88" width="5" height="5" fill="#57e08a"/>
      <rect x="26" y="-68" width="5" height="5" fill="#4bb8f0"/>
    </g>
    <g stroke="#454d57" stroke-width="1" opacity="0.8">
      <path d="M-30,-158 h34 M-30,-140 h34 M-30,-122 h34 M-30,-104 h34 M-30,-86 h34 M-30,-66 h34"/>
    </g>

    <!-- blue tarpaulin flapping over the top -->
    <path d="M-54,-182 L52,-182 L60,-140 Q34,-152 8,-138 Q-22,-124 -56,-142 Z" fill="#2f6fb0"/>
    <path d="M-54,-182 L52,-182 L54,-168 L-54,-168 Z" fill="#3f86cb"/>
    <path d="M52,-182 L60,-140 Q46,-146 44,-176 Z" fill="#24568a"/>

    <!-- ratchet straps -->
    <g stroke="#e2761b" stroke-width="5" stroke-linecap="round">
      <path d="M-50,-150 L50,-150"/>
      <path d="M-50,-92 L50,-92"/>
    </g>
    <rect x="-8" y="-156" width="16" height="12" rx="2" fill="#8a8f96"/>
    <rect x="-8" y="-98" width="16" height="12" rx="2" fill="#8a8f96"/>

    <!-- bamboo prop -->
    <path d="M46,-40 L74,-118" stroke="#9c8244" stroke-width="6" stroke-linecap="round"/>
    <path d="M46,-40 L74,-118" stroke="#c2a45c" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- rain sluicing off the tarp -->
    <g stroke="#cfe6f5" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
      <path d="M-56,-142 l-6,26"/><path d="M60,-140 l7,24"/><path d="M8,-138 l-3,20"/>
    </g>
  </g>

  <!-- tow rope -->
  <path d="M452.5,344.7 Q418,376 381.7,388.8" stroke="#20242a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M452.5,344.7 Q418,376 381.7,388.8" stroke="#8d949c" stroke-width="2.4" fill="none"
        stroke-dasharray="7 6" stroke-linecap="round"/>

  <!-- ================= AUTO-RICKSHAW ================= -->
  <g transform="translate(560,338.7) rotate(-25)">
    <ellipse cx="-6" cy="2" rx="86" ry="8" fill="#080c0e" opacity="0.45"/>

    <!-- headlight beam through the rain -->
    <path d="M74,-56 L210,-100 L215,-6 L76,-26 Z" fill="url(#beamG)"/>

    <!-- wheels -->
    <circle cx="-52" cy="-22" r="22" fill="#14171b"/>
    <circle cx="-52" cy="-22" r="8" fill="#c9ccd1"/>
    <circle cx="56" cy="-18" r="18" fill="#14171b"/>
    <circle cx="56" cy="-18" r="6" fill="#c9ccd1"/>

    <!-- yellow shell: rear panel + roof + windscreen post -->
    <path d="M-92,-30 L-92,-106 Q-92,-122 -74,-122 L34,-122 Q56,-122 60,-106 L70,-72 L58,-68 L48,-102 L-78,-102 L-78,-30 Z"
          fill="#f2c024" stroke="#8f6b0d" stroke-width="2" stroke-linejoin="round"/>
    <!-- cabin interior -->
    <rect x="-78" y="-102" width="126" height="44" fill="#1a1d22"/>
    <!-- occupants -->
    <g fill="#0c0e11">
      <circle cx="-52" cy="-84" r="11"/><path d="M-68,-58 q16,-22 32,0 Z"/>
      <circle cx="20" cy="-86" r="10"/><path d="M6,-58 q14,-20 28,0 Z"/>
      <path d="M28,-84 L56,-70" stroke="#0c0e11" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- green lower body -->
    <rect x="-88" y="-62" width="128" height="40" rx="8" fill="#1f6b4a" stroke="#0f3a28" stroke-width="2"/>
    <rect x="-88" y="-46" width="128" height="4" fill="#0f3a28" opacity="0.7"/>
    <!-- nose -->
    <path d="M40,-62 Q68,-60 74,-40 L76,-28 Q76,-20 66,-20 L40,-20 Z" fill="#1f6b4a" stroke="#0f3a28" stroke-width="2"/>
    <path d="M34,-32 A24,24 0 0 1 80,-36" fill="none" stroke="#f2c024" stroke-width="5" stroke-linecap="round"/>
    <!-- rear fender + hitch -->
    <path d="M-78,-40 A26,26 0 0 0 -26,-40" fill="none" stroke="#f2c024" stroke-width="5" stroke-linecap="round"/>
    <rect x="-102" y="-44" width="14" height="8" rx="2" fill="#5a626b"/>
    <!-- headlight -->
    <circle cx="70" cy="-52" r="7" fill="#fff4c8" filter="url(#glow)"/>
    <!-- roof rim + rain ticks -->
    <path d="M-96,-122 L44,-122" stroke="#f7d76a" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#e8f5ff" stroke-width="1.3" opacity="0.65" stroke-linecap="round">
      <path d="M-70,-126 l-3,-9"/><path d="M-40,-127 l-3,-10"/><path d="M-8,-126 l-3,-9"/>
      <path d="M22,-127 l-3,-10"/><path d="M-92,-108 l-8,7"/><path d="M-92,-92 l-9,8"/>
    </g>
    <!-- wheel spray -->
    <g stroke="#dcecf7" stroke-width="2" opacity="0.5" stroke-linecap="round" fill="none">
      <path d="M-72,-8 q-16,-8 -30,-4"/>
      <path d="M-74,-20 q-20,-12 -36,-10"/>
      <path d="M-70,2 q-18,0 -30,6"/>
    </g>
    <!-- exhaust -->
    <g fill="#9aa4ad" opacity="0.3">
      <circle cx="-108" cy="-24" r="7"/><circle cx="-122" cy="-30" r="10"/><circle cx="-140" cy="-34" r="13"/>
    </g>
  </g>

  <!-- brighter rain inside the headlight beam -->
  <rect width="900" height="600" fill="url(#rainNear)" clip-path="url(#beamClip)" opacity="0.9"/>

  <!-- monsoon rain over everything -->
  <rect width="900" height="600" fill="url(#rainFar)"/>
  <rect width="900" height="600" fill="url(#rainNear)"/>

  <!-- splash ticks where rain hits the road -->
  <g stroke="#dcecf7" stroke-width="1.2" opacity="0.4" fill="none" stroke-linecap="round">
    <path d="M120,566 q6,-8 12,0"/><path d="M300,486 q6,-8 12,0"/><path d="M470,406 q6,-8 12,0"/>
    <path d="M620,336 q6,-8 12,0"/><path d="M760,272 q5,-7 10,0"/><path d="M210,530 q5,-7 10,0"/>
    <path d="M390,446 q5,-7 10,0"/><path d="M690,300 q5,-7 10,0"/>
  </g>

  <!-- out-of-focus foreground -->
  <g filter="url(#fgblur)" opacity="0.9">
    <path d="M0,600 L0,520 Q40,540 60,600 Z" fill="#0c1712"/>
    <g stroke="#0f2018" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M20,600 q10,-58 -10,-92"/>
      <path d="M56,600 q4,-50 26,-78"/>
      <path d="M92,600 q-2,-44 -22,-66"/>
      <path d="M868,300 q14,-46 42,-62"/>
    </g>
  </g>
  <g filter="url(#fgblur)" stroke="#eaf4ff" stroke-width="4" opacity="0.28" stroke-linecap="round">
    <path d="M150,-20 L110,140"/><path d="M420,10 L378,180"/><path d="M700,420 L662,580"/>
    <path d="M840,120 L800,290"/><path d="M260,300 L222,470"/>
  </g>
</svg>