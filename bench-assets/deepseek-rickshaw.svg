<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="60%" stop-color="#2c3a4f"/>
      <stop offset="100%" stop-color="#4e6b7b"/>
    </linearGradient>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff59d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff59d" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Server Rack Component -->
    <g id="server-rack">
      <!-- Cart Base -->
      <rect x="-45" y="10" width="90" height="15" rx="4" fill="#444"/>
      <rect x="-45" y="25" width="90" height="5" fill="#222"/>
      <!-- Cart Wheels -->
      <circle cx="-25" cy="35" r="16" fill="#111"/>
      <circle cx="-25" cy="35" r="10" fill="#555"/>
      <circle cx="25" cy="35" r="16" fill="#111"/>
      <circle cx="25" cy="35" r="10" fill="#555"/>
      <!-- Hazard Placard -->
      <rect x="-20" y="15" width="40" height="10" fill="#ffcc00"/>
      <text x="0" y="23" font-family="monospace" font-size="8" font-weight="bold" fill="#000" text-anchor="middle">TOWING</text>
      <!-- Rack Cabinet -->
      <rect x="-35" y="-120" width="70" height="130" rx="4" fill="#1a1a1a"/>
      <rect x="-35" y="-120" width="70" height="130" rx="4" fill="none" stroke="#333" stroke-width="2"/>
      <!-- Ventilation Side Slots -->
      <line x1="-35" y1="-100" x2="35" y2="-100" stroke="#2a2a2a" stroke-width="4"/>
      <line x1="-35" y1="-70" x2="35" y2="-70" stroke="#2a2a2a" stroke-width="4"/>
      <line x1="-35" y1="-40" x2="35" y2="-40" stroke="#2a2a2a" stroke-width="4"/>
      <!-- Servers / Blades -->
      <rect x="-30" y="-95" width="60" height="20" rx="2" fill="#262626"/>
      <rect x="-30" y="-65" width="60" height="20" rx="2" fill="#262626"/>
      <rect x="-30" y="-35" width="60" height="20" rx="2" fill="#262626"/>
      <rect x="-30" y="-5" width="60" height="20" rx="2" fill="#262626"/>
      <!-- Blinking LEDs -->
      <circle cx="-20" cy="-85" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
      <circle cx="-10" cy="-85" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
      <circle cx="0" cy="-85" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
      <circle cx="10" cy="-85" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
      <circle cx="-20" cy="-55" r="2.5" fill="#ff5252" filter="url(#glow)"/>
      <circle cx="0" cy="-55" r="2.5" fill="#ff5252" filter="url(#glow)"/>
      <circle cx="10" cy="-55" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
      <circle cx="-20" cy="-25" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
      <circle cx="-10" cy="-25" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
      <circle cx="0" cy="-25" r="2.5" fill="#ff5252" filter="url(#glow)"/>
      <circle cx="10" cy="-25" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
      <circle cx="-10" cy="5" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
      <circle cx="0" cy="5" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
      <!-- Cable Mess Dangling -->
      <path d="M -35,-80 Q -50,-70 -45,-50 T -35,-20" fill="none" stroke="#e53935" stroke-width="3"/>
      <path d="M -35,-70 Q -55,-60 -50,-40" fill="none" stroke="#1e88e5" stroke-width="3"/>
      <path d="M -35,-90 Q -45,-80 -40,-70" fill="none" stroke="#fdd835" stroke-width="2"/>
      <!-- Tow Hitch -->
      <path d="M 45,15 L 60,15 L 60,25" fill="none" stroke="#777" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Auto-Rickshaw Component -->
    <g id="rickshaw">
      <!-- Chassis -->
      <rect x="-80" y="-15" width="160" height="20" rx="5" fill="#212121"/>
      <!-- Engine / Battery Hood -->
      <rect x="10" y="-35" width="60" height="20" rx="6" fill="#f57f17"/>
      <!-- Front Wheel (Right side) -->
      <circle cx="65" cy="15" r="32" fill="#111"/>
      <circle cx="65" cy="15" r="22" fill="#444"/>
      <circle cx="65" cy="15" r="10" fill="#666"/>
      <!-- Front Mudguard -->
      <path d="M 35,5 Q 45,-5 65,-10 Q 85,-5 90,5" fill="none" stroke="#212121" stroke-width="8" stroke-linecap="round"/>
      <!-- Rear Wheel (Left side) -->
      <circle cx="-65" cy="18" r="28" fill="#111"/>
      <circle cx="-65" cy="18" r="18" fill="#444"/>
      <circle cx="-65" cy="18" r="8" fill="#666"/>
      <!-- Spare Tire on Back -->
      <circle cx="-95" cy="-15" r="15" fill="#111"/>
      <circle cx="-95" cy="-15" r="8" fill="#444"/>
      <!-- Cabin Body -->
      <rect x="-60" y="-70" width="80" height="55" rx="10" fill="#ffca28"/>
      <!-- Windshield -->
      <path d="M -60,-45 L 20,-15 L -60,-15 Z" fill="#90caf9" opacity="0.8"/>
      <path d="M -60,-45 L 20,-15 L -60,-15 Z" fill="none" stroke="#212121" stroke-width="3"/>
      <!-- Roof Supports -->
      <line x1="-45" y1="-70" x2="-45" y2="-95" stroke="#212121" stroke-width="5"/>
      <line x1="0" y1="-70" x2="0" y2="-95" stroke="#212121" stroke-width="5"/>
      <!-- Canopy (Roof) -->
      <path d="M -55,-95 Q -20,-115 20,-95 L 20,-80 Q -20,-100 -55,-80 Z" fill="#f57f17"/>
      <path d="M -55,-95 Q -20,-115 20,-95 L 20,-80 Q -20,-100 -55,-80 Z" fill="none" stroke="#212121" stroke-width="3"/>
      <!-- Driver Silhouette -->
      <circle cx="-15" cy="-50" r="10" fill="#212121"/>
      <path d="M -15,-40 L -15,-25" stroke="#212121" stroke-width="6" stroke-linecap="round"/>
      <path d="M -25,-35 L -15,-30" stroke="#212121" stroke-width="4" stroke-linecap="round"/> <!-- Arm -->
      <!-- Handlebars -->
      <path d="M -5,-30 L 15,-30" stroke="#555" stroke-width="4" stroke-linecap="round"/>
      <circle cx="15" cy="-30" r="4" fill="#333"/> <!-- Handle grip -->
      <!-- Headlight -->
      <ellipse cx="65" cy="-5" rx="10" ry="7" fill="#fff9c4" filter="url(#glow)"/>
      <ellipse cx="65" cy="-5" rx="6" ry="4" fill="#fff"/>
      <!-- Exhaust Pipe -->
      <path d="M -80,-10 L -110,-10" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <path d="M -110,-10 L -110,-5" stroke="#555" stroke-width="4" stroke-linecap="round"/>
      <!-- Exhaust Smoke -->
      <circle cx="-115" cy="-15" r="8" fill="#ddd" opacity="0.4"/>
      <circle cx="-125" cy="-25" r="12" fill="#ddd" opacity="0.3"/>
      <circle cx="-140" cy="-40" r="18" fill="#ddd" opacity="0.2"/>
      <circle cx="-160" cy="-60" r="25" fill="#ddd" opacity="0.1"/>
      <!-- Tow Hitch (Attached to Chassis) -->
      <path d="M -80,-10 L -95,-10 L -95,5" fill="none" stroke="#777" stroke-width="5" stroke-linecap="round"/>
      <!-- License Plate -->
      <rect x="15" y="-20" width="25" height="12" rx="2" fill="#eee" stroke="#333" stroke-width="1"/>
      <text x="27" y="-11" font-family="sans-serif" font-size="6" font-weight="bold" fill="#333" text-anchor="middle">TUK</text>
      <!-- Motion Lines -->
      <line x1="-120" y1="0" x2="-140" y2="0" stroke="#fff" stroke-width="2" opacity="0.5"/>
      <line x1="-130" y1="10" x2="-160" y2="10" stroke="#fff" stroke-width="2" opacity="0.5"/>
      <line x1="-115" y1="20" x2="-135" y2="20" stroke="#fff" stroke-width="2" opacity="0.4"/>
    </g>
  </defs>

  <!-- Background Sky -->
  <rect width="1000" height="600" fill="url(#skyGrad)"/>

  <!-- Lightning Bolt -->
  <polygon points="800,0 770,60 785,70 730,160 750,170 680,280" fill="#fff" opacity="0.3"/>
  <polygon points="800,0 780,50 790,60 740,140 755,150 690,250" fill="#fff" opacity="0.6"/>

  <!-- Monsoon Rain (Layer 1 - Background) -->
  <g stroke="#8aaec4" stroke-width="1.5" opacity="0.4">
    <line x1="100" y1="-20" x2="60" y2="80"/>
    <line x1="250" y1="50" x2="210" y2="150"/>
    <line x1="400" y1="-10" x2="360" y2="90"/>
    <line x1="550" y1="20" x2="510" y2="120"/>
    <line x1="700" y1="-30" x2="660" y2="70"/>
    <line x1="850" y1="40" x2="810" y2="140"/>
    <line x1="950" y1="10" x2="910" y2="110"/>
    <line x1="150" y1="200" x2="110" y2="300"/>
    <line x1="350" y1="180" x2="310" y2="280"/>
    <line x1="500" y1="150" x2="460" y2="250"/>
    <line x1="650" y1="170" x2="610" y2="270"/>
    <line x1="800" y1="200" x2="760" y2="300"/>
    <line x1="900" y1="180" x2="860" y2="280"/>
  </g>

  <!-- Road Surface (Steep Hill) -->
  <path d="M -50,650 L 150,550 Q 450,450 850,300 L 1050,300 L 1050,650 Z" fill="#2d1f1c"/>
  <!-- Road Edge / Curb -->
  <path d="M -50,650 L 150,550 Q 450,450 850,300 L 1050,300" fill="none" stroke="#1a1110" stroke-width="20"/>
  <path d="M -50,650 L 150,550 Q 450,450 850,300 L 1050,300" fill="none" stroke="#4e342e" stroke-width="6"/>

  <!-- Puddles on the Road -->
  <ellipse cx="200" cy="560" rx="70" ry="20" fill="#1a1110"/>
  <ellipse cx="200" cy="560" rx="60" ry="15" fill="none" stroke="#3e2c2a" stroke-width="2"/>
  
  <ellipse cx="550" cy="450" rx="80" ry="22" fill="#1a1110"/>
  <ellipse cx="550" cy="450" rx="70" ry="18" fill="none" stroke="#3e2c2a" stroke-width="2"/>
  
  <ellipse cx="800" cy="360" rx="90" ry="25" fill="#1a1110"/>
  <ellipse cx="800" cy="360" rx="80" ry="20" fill="none" stroke="#3e2c2a" stroke-width="2"/>

  <!-- Server Rack Positioned on the Road -->
  <!-- Translate to x=320, y=485, rotate slightly to match slope -->
  <use href="#server-rack" x="320" y="485" transform="rotate(3 320 485)"/>

  <!-- Headlight Beam (Cutting through rain) -->
  <polygon points="390,470 1050,250 1050,550" fill="url(#beamGrad)"/>

  <!-- Tow Rope Connecting Rack to Rickshaw -->
  <path d="M 380,490 Q 500,450 630,355" fill="none" stroke="#aaa" stroke-width="5" stroke-dasharray="12,6"/>
  <path d="M 380,490 Q 500,450 630,355" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="12,6" opacity="0.5"/>

  <!-- Auto-Rickshaw Positioned Uphill (Pulling) -->
  <!-- Translate to x=700, y=360, rotate to climb the steep hill -->
  <use href="#rickshaw" x="700" y="360" transform="rotate(-12 700 360)"/>

  <!-- Water Splashes from Wheels -->
  <!-- Rickshaw Wheel Splash -->
  <g stroke="#a9ccee" stroke-width="2" opacity="0.7">
    <line x1="630" y1="370" x2="615" y2="355"/>
    <line x1="632" y1="375" x2="612" y2="365"/>
    <line x1="635" y1="380" x2="618" y2="370"/>
    <line x1="628" y1="365" x2="618" y2="345"/>
  </g>
  <g stroke="#a9ccee" stroke-width="2" opacity="0.7">
    <line x1="768" y1="355" x2="783" y2="340"/>
    <line x1="766" y1="360" x2="785" y2="348"/>
    <line x1="763" y1="365" x2="780" y2="355"/>
    <line x1="770" y1="350" x2="786" y2="335"/>
  </g>
  <!-- Server Rack Wheel Splash -->
  <g stroke="#a9ccee" stroke-width="2" opacity="0.6">
    <line x1="295" y1="520" x2="285" y2="510"/>
    <line x1="298" y1="520" x2="290" y2="505"/>
    <line x1="302" y1="520" x2="295" y2="515"/>
    <line x1="345" y1="520" x2="355" y2="510"/>
    <line x1="342" y1="520" x2="350" y2="505"/>
    <line x1="338" y1="520" x2="345" y2="515"/>
  </g>

  <!-- Foreground Monsoon Rain (Layer 2 - Heavy) -->
  <g stroke="#c5dff5" stroke-width="2.5" opacity="0.6">
    <line x1="50" y1="300" x2="0" y2="450"/>
    <line x1="200" y1="350" x2="150" y2="500"/>
    <line x1="400" y1="280" x2="350" y2="430"/>
    <line x1="600" y1="320" x2="550" y2="470"/>
    <line x1="750" y1="250" x2="700" y2="400"/>
    <line x1="900" y1="300" x2="850" y2="450"/>
    
    <line x1="120" y1="400" x2="80" y2="520"/>
    <line x1="280" y1="420" x2="240" y2="540"/>
    <line x1="480" y1="380" x2="440" y2="500"/>
    <line x1="680" y1="400" x2="640" y2="520"/>
    <line x1="820" y1="360" x2="780" y2="480"/>
    <line x1="980" y1="380" x2="940" y2="500"/>
    
    <line x1="80" y1="100" x2="20" y2="250"/>
    <line x1="320" y1="120" x2="260" y2="270"/>
    <line x1="580" y1="80" x2="520" y2="230"/>
    <line x1="860" y1="110" x2="800" y2="260"/>
  </g>

  <!-- Windblown Mist/Fog Overlay -->
  <ellipse cx="200" cy="500" rx="300" ry="60" fill="#a9ccee" opacity="0.05"/>
  <ellipse cx="700" cy="400" rx="400" ry="80" fill="#a9ccee" opacity="0.05"/>
</svg>
