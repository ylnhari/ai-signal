    <path d="M 110 440 Q 130 470 150 440" fill="none" stroke="#fff8dc" stroke-width="4" />
    <path d="M 150 440 Q 170 470 190 440" fill="none" stroke="#ff8844" stroke-width="4" />

    <!-- Stall 2 (Center - Tea & Kaapi Stall) -->
    <rect x="350" y="410" width="300" height="210" fill="#2b1a12" />
    <polygon points="330,410 500,320 670,410" fill="#522a1d" />
    <rect x="390" y="470" width="90" height="150" fill="#090503" />
    <rect x="510" y="470" width="110" height="150" fill="#090503" />
