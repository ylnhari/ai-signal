    <rect x="520" y="480" width="90" height="90" fill="#ffaa33" opacity="0.3" />
    
    <!-- Stall 3 (Right - Vegetable / Banana Leaf Vendor) -->
    <rect x="740" y="430" width="360" height="190" fill="#1c261e" />
    <polygon points="720,430 920,340 1120,430" fill="#263629" />
    <rect x="770" y="480" width="130" height="140" fill="#080c09" />
    <rect x="940" y="480" width="130" height="140" fill="#080c09" />
