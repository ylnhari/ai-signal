<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="50%" stop-color="#2a1f2d" />
      <stop offset="100%" stop-color="#4a2522" />
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#141922" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect x="0" y="0" width="1200" height="500" fill="url(#sky)" />

  <!-- Moon -->
  <circle id="moon" cx="950" cy="120" r="35" fill="#fdf0d5" opacity="0.85" />
  <circle cx="940" cy="115" r="35" fill="#201a24" opacity="0.6" />

  <!-- Distant Silhouettes -->
  <path d="M 0 500 L 0 350 L 50 320 L 90 350 L 150 300 L 220 360 L 300 280 L 380 340 L 450 310 L 520 370 L 600 290 L 680 350 L 750 320 L 820 380 L 900 300 L 980 340 L 1050 310 L 1120 360 L 1200 330 L 1200 500 Z" fill="#1b1722" />

  <!-- Ground -->
