<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2140"/>
      <stop offset="0.45" stop-color="#4a3a5c"/>
      <stop offset="0.75" stop-color="#8a5a52"/>
      <stop offset="1" stop-color="#c47a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4e6c0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f4e6c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#sky)"/>

  <!-- moon halo + moon -->
  <circle cx="960" cy="150" r="120" fill="url(#glow)"/>
  <circle id="moon" cx="960" cy="150" r="55" fill="#f6ead0"/>
  <circle cx="985" cy="135" r="52" fill="#e9d9b8" opacity="0.5"/>

  <!-- distant skyline -->
  <g fill="#2f2740">
    <rect x="0" y="360" width="90" height="200"/>
    <rect x="110" y="320" width="70" height="240"/>
    <rect x="200" y="380" width="110" height="180"/>
    <rect x="330" y="300" width="60" height="260"/>
    <rect x="410" y="350" width="130" height="210"/>
    <rect x="1060" y="330" width="90" height="230"/>
    <rect x="1150" y="370" width="60" height="190"/>
  </g>

  <!-- wet street -->
  <rect x="0" y="560" width="1200" height="240" fill="#241d2c"/>
  <rect x="0" y="560" width="1200" height="60" fill="#3a2f42"/>

  <!-- puddle reflecting warm light -->
  <path id="puddle" d="M 300 720 Q 480 690 700 720 Q 820 740 700 760 Q 480 785 300 760 Q 210 740 300 720 Z" fill="#6b4a38" opacity="0.7"/>
  <path d="M 360 725 Q 500 712 640 728" stroke="#e0a860" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 400 745 Q 520 736 620 748" stroke="#f4d090" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- market stalls -->
  <g id="stalls">
    <rect x="120" y="470" width="200" height="120" fill="#5a3a2e"/>
    <rect x="110" y="450" width="220" height="30" fill="#a83b3b"/>
    <rect x="150" y="500" width="140" height="70" fill="#e0b050"/>

    <rect x="380" y="480" width="210" height="110" fill="#3d5a3a"/>
    <rect x="370" y="458" width="230" height="30" fill="#c56a2a"/>
    <rect x="410" y="505" width="150" height="65" fill="#d89a44"/>

    <rect x="650" y="465" width="220" height="125" fill="#463a5c"/>
    <rect x="640" y="443" width="240" height="30" fill="#3b7ba8"/>
    <rect x="685" y="498" width="150" height="72" fill="#e8c060"/>

    <rect x="930" y="485" width="180" height="105" fill="#5a4030"/>
    <rect x="920" y="463" width="200" height="30" fill="#b04848"/>
    <rect x="960" y="510" width="120" height="60" fill="#dca850"/>
  </g>

  <!-- stall lamp glows -->
  <circle cx="220" cy="455" r="10" fill="#ffe38a"/>
  <circle cx="490" cy="463" r="10" fill="#ffe38a"/>
  <circle cx="760" cy="448" r="10" fill="#ffe38a"/>
  <circle cx="1015" cy="468" r="10" fill="#ffe38a"/>

  <!-- signboard -->
  <rect x="655" y="405" width="150" height="34" rx="4" fill="#1c2630"/>
  <text x="668" y="429" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f4c04a">HOT KAAPI</text>

