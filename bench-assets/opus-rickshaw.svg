<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3a44"/>
      <stop offset="0.55" stop-color="#556069"/>
      <stop offset="1" stop-color="#828b94"/>
    </linearGradient>
    <linearGradient id="hillg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41493a"/>
      <stop offset="1" stop-color="#282e22"/>
    </linearGradient>
    <linearGradient id="rackg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3037"/>
      <stop offset="1" stop-color="#14171b"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#sky)"/>

  <!-- rain clouds -->
  <g fill="#454f58" opacity="0.6">
    <ellipse cx="260" cy="110" rx="150" ry="46"/>
    <ellipse cx="420" cy="90" rx="120" ry="40"/>
    <ellipse cx="880" cy="130" rx="170" ry="50"/>
    <ellipse cx="1040" cy="105" rx="120" ry="40"/>
  </g>

  <!-- distant misty ridge -->
  <path d="M 0 430 Q 300 350 600 405 Q 900 455 1200 390 L 1200 800 L 0 800 Z" fill="#6a747e" opacity="0.5"/>

  <!-- steep hill -->
  <path d="M 0 800 L 0 660 Q 450 570 1200 190 L 1200 800 Z" fill="url(#hillg)"/>
  <!-- road surface -->
  <path d="M 0 700 Q 450 610 1200 235 L 1200 315 Q 450 685 0 770 Z" fill="#31363c"/>
  <!-- centre line -->
  <path d="M 40 738 Q 460 648 1200 278" fill="none" stroke="#c9b458" stroke-width="5" stroke-dasharray="34 30" opacity="0.7"/>

  <!-- ===== rig tilted to the incline ===== -->
  <g transform="translate(560 440) rotate(-26)">

    <!-- towed rack on trailer -->
    <g transform="translate(-340 -150)">
      <rect x="-10" y="150" width="182" height="20" rx="4" fill="#2a2a2a"/>
      <rect x="10" y="0" width="140" height="152" rx="6" fill="url(#rackg)" stroke="#0c0e11" stroke-width="3"/>
      <g fill="#3a4048" stroke="#0c0e11" stroke-width="1.5">
        <rect x="22" y="12" width="116" height="18" rx="2"/>
        <rect x="22" y="36" width="116" height="18" rx="2"/>
        <rect x="22" y="60" width="116" height="18" rx="2"/>
        <rect x="22" y="84" width="116" height="18" rx="2"/>
        <rect x="22" y="108" width="116" height="18" rx="2"/>
        <rect x="22" y="132" width="116" height="14" rx="2"/>
      </g>
      <g>
        <circle cx="30" cy="21" r="3" fill="#4ade80"/>
        <circle cx="42" cy="21" r="3" fill="#facc15"/>
        <circle cx="30" cy="45" r="3" fill="#4ade80"/>
        <circle cx="42" cy="45" r="3" fill="#4ade80"/>
        <circle cx="30" cy="69" r="3" fill="#f87171"/>
        <circle cx="30" cy="93" r="3" fill="#4ade80"/>
        <circle cx="30" cy="117" r="3" fill="#facc15"/>
      </g>
      <circle cx="62" cy="182" r="26" fill="#181818" stroke="#000" stroke-width="3"/>
      <circle cx="62" cy="182" r="9" fill="#555"/>
      <!-- tow bar -->
      <rect x="150" y="158" width="120" height="8" rx="4" fill="#454545"/>
    </g>

    <!-- auto-rickshaw -->
    <g transform="translate(-80 -210)">
      <path d="M 20 120 Q 20 30 110 30 L 200 30 Q 250 30 258 90 L 262 200 L 20 200 Z"
            fill="#f4c430" stroke="#b8860b" stroke-width="4"/>
      <path d="M 20 120 Q 18 34 110 30 L 205 30 Q 250 32 258 92 L 258 74 Q 240 44 150 44 L 110 44 Q 42 46 40 120 Z"
            fill="#1f2933"/>
      <path d="M 20 175 L 262 178 L 262 200 L 20 200 Z" fill="#2f6b3f"/>
      <path d="M 60 90 Q 60 60 100 60 L 150 60 Q 160 60 160 90 L 160 168 L 60 168 Z" fill="#232e38"/>
      <path d="M 210 66 Q 244 70 250 110 L 250 150 L 212 150 Z" fill="#bcd4e0" opacity="0.85"/>
      <rect x="210" y="60" width="6" height="95" fill="#1f2933"/>
      <path d="M 250 120 Q 292 122 296 168 L 296 200 L 250 200 Z" fill="#f4c430" stroke="#b8860b" stroke-width="4"/>
      <circle cx="286" cy="176" r="11" fill="#fff3b0" stroke="#b8860b" stroke-width="3"/>
      <path d="M 296 176 L 384 148 L 384 208 Z" fill="#fff3b0" opacity="0.18"/>
      <circle cx="90" cy="205" r="34" fill="#181818" stroke="#000" stroke-width="4"/>
      <circle cx="90" cy="205" r="12" fill="#666"/>
      <circle cx="278" cy="212" r="30" fill="#181818" stroke="#000" stroke-width="4"/>
      <circle cx="278" cy="212" r="10" fill="#666"/>
      <g fill="#9aa2ab" opacity="0.5">
        <circle cx="8" cy="180" r="9"/>
        <circle cx="-6" cy="172" r="7"/>
        <circle cx="-18" cy="166" r="5"/>
      </g>
    </g>
  </g>

