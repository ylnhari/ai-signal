<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d4e"/>
      <stop offset="0.5" stop-color="#5b3a6e"/>
      <stop offset="0.8" stop-color="#b3573a"/>
      <stop offset="1" stop-color="#e0824a"/>
    </linearGradient>
    <linearGradient id="tarp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4622f"/>
      <stop offset="1" stop-color="#8f3c1c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#sky)"/>

  <circle id="moon" cx="980" cy="140" r="55" fill="#f3e9c8" opacity="0.9"/>

  <!-- distant skyline -->
  <rect x="0" y="300" width="180" height="220" fill="#241736"/>
  <rect x="160" y="340" width="140" height="180" fill="#2c1b40"/>
  <rect x="880" y="320" width="160" height="200" fill="#241736"/>
  <rect x="1040" y="360" width="160" height="160" fill="#2c1b40"/>
  <rect x="30" y="330" width="14" height="18" fill="#f2b64a"/>
  <rect x="70" y="370" width="14" height="18" fill="#f2b64a"/>
  <rect x="920" y="350" width="14" height="18" fill="#f2b64a"/>
  <rect x="1080" y="390" width="14" height="18" fill="#f2b64a"/>

  <!-- street -->
  <rect x="0" y="520" width="1200" height="280" fill="#3a2f33"/>

  <!-- stalls -->
  <g id="stalls">
    <!-- stall 1 -->
    <rect x="120" y="400" width="220" height="150" fill="#5c3b23"/>
    <polygon points="100,400 360,400 340,350 120,350" fill="url(#tarp)"/>
    <rect x="140" y="440" width="180" height="40" fill="#7a4e2c"/>
    <rect x="150" y="450" width="30" height="20" fill="#c9932f"/>
    <rect x="190" y="450" width="30" height="20" fill="#a83b2a"/>
    <rect x="230" y="450" width="30" height="20" fill="#3f7a34"/>
    <rect x="128" y="360" width="16" height="16" fill="#f7c35c"/>
    <text x="160" y="390" font-size="26" fill="#f7e6b0" font-family="sans-serif">KAAPI KADAI</text>

    <!-- stall 2 -->
    <rect x="440" y="410" width="240" height="140" fill="#4d3a55"/>
    <polygon points="420,410 700,410 680,355 440,355" fill="#2f6b6b"/>
    <rect x="460" y="450" width="200" height="38" fill="#6a4f75"/>
    <rect x="470" y="458" width="34" height="22" fill="#d1b23a"/>
    <rect x="514" y="458" width="34" height="22" fill="#b04a2e"/>
    <rect x="558" y="458" width="34" height="22" fill="#5a8a3c"/>
    <rect x="602" y="458" width="34" height="22" fill="#c96a9a"/>
    <rect x="452" y="368" width="16" height="16" fill="#f7c35c"/>
    <text x="480" y="398" font-size="24" fill="#f7e6b0" font-family="sans-serif">MALLI POO</text>

    <!-- stall 3 -->
    <rect x="800" y="405" width="230" height="145" fill="#5a4326"/>
    <polygon points="780,405 1050,405 1030,352 800,352" fill="#8f2f3c"/>
    <rect x="820" y="446" width="190" height="40" fill="#7d5a30"/>
    <circle cx="850" cy="466" r="12" fill="#e0a13a"/>
    <circle cx="885" cy="466" r="12" fill="#c94f2a"/>
    <circle cx="920" cy="466" r="12" fill="#e0c04a"/>
    <circle cx="955" cy="466" r="12" fill="#6a9a3c"/>
    <rect x="810" y="364" width="16" height="16" fill="#f7c35c"/>
    <text x="835" y="394" font-size="24" fill="#f7e6b0" font-family="sans-serif">PAZHAM</text>
  </g>

  <!-- lamp post -->
  <rect x="720" y="300" width="10" height="250" fill="#26202a"/>
  <circle cx="725" cy="292" r="16" fill="#f7d36a"/>
  <ellipse cx="725" cy="560" rx="90" ry="16" fill="#f7d36a" opacity="0.18"/>

  <!-- people -->
  <circle cx="390" cy="560" r="14" fill="#2a2030"/>
  <rect x="378" y="574" width="24" height="46" fill="#7a2f4a" rx="6"/>
  <circle cx="560" cy="570" r="13" fill="#2a2030"/>
  <rect x="549" y="583" width="22" height="42" fill="#2f5a7a" rx="6"/>
  <circle cx="600" cy="574" r="10" fill="#2a2030"/>
  <rect x="592" y="584" width="16" height="32" fill="#b0762f" rx="5"/>

  <!-- puddle with reflections -->
  <path id="puddle" d="M300 690 C 360 665, 520 660, 600 685 C 680 710, 560 735, 450 730 C 360 726, 250 715, 300 690 Z" fill="#4a3f63" opacity="0.85"/>
  <path d="M420 690 L 435 690 L 432 722 L 423 722 Z" fill="#f2c45c" opacity="0.35"/>
  <path d="M500 688 L 512 688 L 510 718 L 502 718 Z" fill="#e0824a" opacity="0.3"/>

